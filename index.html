<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aplikasi Kinerja Guru</title>
<style>
:root{--primary:#1d4ed8;--dark:#0f172a;--bg:#f1f5f9;--card:#fff;--muted:#64748b;--border:#e2e8f0;--danger:#dc2626;--ok:#15803d;--warn:#b45309}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#172033}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}
.hidden{display:none!important}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#0f172a,#1d4ed8)}
.login-card{width:min(430px,100%);background:white;border-radius:18px;padding:30px;box-shadow:0 20px 50px #0004}.login-card h1{margin:0 0 8px}.login-card p{color:var(--muted)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:9px;background:white}
textarea{min-height:80px;resize:vertical}.field{margin-bottom:12px}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}
.btn{padding:10px 14px;border-radius:9px;background:var(--primary);color:white}.btn.secondary{background:#475569}.btn.success{background:var(--ok)}.btn.danger{background:var(--danger)}.btn.light{background:#e2e8f0;color:#0f172a}
.app{display:flex;min-height:100vh}.sidebar{width:245px;background:#0f172a;color:white;padding:18px;position:fixed;inset:0 auto 0 0;overflow:auto}.brand{font-size:20px;font-weight:bold;margin:8px 6px 25px}.nav button{display:block;width:100%;text-align:left;padding:12px;margin:5px 0;background:transparent;color:#cbd5e1;border-radius:9px}.nav button.active,.nav button:hover{background:#1e293b;color:white}
.main{margin-left:245px;width:calc(100% - 245px);padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h2{margin:0}.card{background:white;border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:0 3px 10px #00000008}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{padding:17px;border-radius:12px;background:white;border:1px solid var(--border)}.stat b{font-size:28px;display:block;margin-top:5px}.muted{color:var(--muted);font-size:13px}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:10px;border-bottom:1px solid var(--border);text-align:left;font-size:13px;vertical-align:top}th{background:#f8fafc}.actions{display:flex;gap:6px;flex-wrap:wrap}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#e2e8f0;font-size:11px;font-weight:bold}.badge.ok{background:#dcfce7;color:#166534}.badge.warn{background:#fef3c7;color:#92400e}.badge.bad{background:#fee2e2;color:#991b1b}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form-grid.three{grid-template-columns:repeat(3,1fr)}.form-actions{display:flex;gap:8px;margin-top:8px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-title h3{margin:0}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.modal-box{background:white;border-radius:15px;padding:22px;width:min(720px,100%);max-height:90vh;overflow:auto}
@media(max-width:900px){.sidebar{position:static;width:100%;height:auto}.app{display:block}.main{margin:0;width:100%}.grid{grid-template-columns:repeat(2,1fr)}.form-grid,.form-grid.three{grid-template-columns:1fr}.nav{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.nav button{margin:0}}
@media(max-width:500px){.grid{grid-template-columns:1fr}.main{padding:12px}}
@media print{.sidebar,.top .actions,.no-print{display:none!important}.main{margin:0;width:100%;padding:0}.card{box-shadow:none}}
</style>
</head>
<body>

<div id="loginPage" class="login">
  <div class="login-card">
    <h1>Aplikasi Kinerja Guru</h1>
    <p>Login Admin atau Guru</p>
    <div class="field"><label>Username</label><input id="loginUser"></div>
    <div class="field"><label>Password</label><input id="loginPass" type="password"></div>
    <button class="btn" style="width:100%" onclick="doLogin()">Masuk</button>
    <div id="loginMsg" class="muted" style="margin-top:12px"></div>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand">KINERJA GURU</div>
    <div class="nav" id="nav"></div>
    <button class="btn danger" style="width:100%;margin-top:20px" onclick="logout()">Keluar</button>
  </aside>
  <main class="main">
    <div class="top">
      <div><h2 id="pageTitle">Dashboard</h2><div class="muted" id="schoolName"></div></div>
      <div class="actions"><button class="btn light" onclick="loadData()">↻ Muat Ulang</button></div>
    </div>
    <div id="content"></div>
  </main>
</div>

<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>

<script>
let state={role:null,nama:'',data:null,currentGuru:null};

function call(fn,...args){
  return new Promise((resolve,reject)=>{
    google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(e))[fn](...args);
  });
}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function badge(s){
  s=String(s||'');
  let c=/DISETUJUI|AKTIF|YA|HADIR/i.test(s)?'ok':/PERLU|MENUNGGU|NONAKTIF|BELUM/i.test(s)?'warn':'';
  return `<span class="badge ${c}">${esc(s)}</span>`;
}
async function doLogin(){
  const msg=document.getElementById('loginMsg');msg.textContent='Memproses...';
  try{
    const r=await call('login',document.getElementById('loginUser').value,document.getElementById('loginPass').value);
    if(!r.success){msg.textContent=r.message;return}
    state.role=r.role;state.nama=r.nama;state.guruId=r.guruId;
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    buildNav();await loadData();
  }catch(e){msg.textContent=e.message||e}
}
function logout(){location.reload()}
function buildNav(){
  const n=document.getElementById('nav');
  if(state.role==='ADMIN'){
    n.innerHTML=[
      ['dashboard','Dashboard'],['settings','Pengaturan'],['admin','Jenis Administrasi'],
      ['indikator','Indikator Kinerja'],['kegiatan','Poin Kegiatan'],['periode','Periode'],['guru','Data Guru'],['reports','Laporan Guru']
    ].map(x=>`<button id="nav-${x[0]}" onclick="showPage('${x[0]}')">${x[1]}</button>`).join('');
  }else{
    n.innerHTML=`<button id="nav-myreport" onclick="showPage('myreport')">Laporan Kinerja Saya</button>`;
  }
}
async function loadData(){
  try{
    state.data=await call('dashboard',state.role,state.guruId);
    document.getElementById('schoolName').textContent=state.data.settings?.NAMA_SEKOLAH||'';
    showPage(state.role==='ADMIN'?'dashboard':'myreport');
  }catch(e){alert(e.message||e)}
}
function showPage(p){
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+p)?.classList.add('active');
  const titles={dashboard:'Dashboard',settings:'Pengaturan',admin:'Jenis Administrasi',indikator:'Indikator Kinerja',kegiatan:'Poin Kegiatan',periode:'Periode',guru:'Data Guru',reports:'Laporan Semua Guru',myreport:'Laporan Kinerja Saya'};
  document.getElementById('pageTitle').textContent=titles[p]||'Dashboard';
  const c=document.getElementById('content');
  if(p==='dashboard')renderDashboard(c);
  if(p==='settings')renderSettings(c);
  if(p==='admin')renderAdmin(c);
  if(p==='indikator')renderIndikator(c);
  if(p==='kegiatan')renderKegiatan(c);
  if(p==='periode')renderPeriode(c);
  if(p==='guru')renderGuru(c);
  if(p==='reports')renderReports(c);
  if(p==='myreport')renderMyReport(c);
}
function renderDashboard(c){
  const d=state.data;
  c.innerHTML=`<div class="grid">
    <div class="stat"><div class="muted">Guru Aktif</div><b>${d.guru.filter(x=>String(x.Status||'Aktif')==='Aktif').length}</b></div>
    <div class="stat"><div class="muted">Jenis Administrasi</div><b>${d.jenisAdmin.filter(x=>String(x.Status||'Aktif')==='Aktif').length}</b></div>
    <div class="stat"><div class="muted">Indikator Kinerja</div><b>${d.indikator.filter(x=>String(x.Status||'Aktif')==='Aktif').length}</b></div>
    <div class="stat"><div class="muted">Periode Aktif</div><b>${d.periode.filter(x=>String(x.Status||'Aktif')==='Aktif').length}</b></div>
  </div>
  <div class="card"><h3>Konfigurasi aktif</h3>
  <p><b>Sekolah:</b> ${esc(d.settings.NAMA_SEKOLAH||'-')}</p>
  <p><b>Tahun Pelajaran:</b> ${esc(d.settings.TAHUN_PELAJARAN||'-')} &nbsp; <b>Semester:</b> ${esc(d.settings.SEMESTER||'-')}</p>
  <p><b>Folder Drive:</b> ${esc(d.settings.FOLDER_ID||'-')}</p></div>`;
}
function renderSettings(c){
  const s=state.data.settings||{};
  c.innerHTML=`<div class="card"><div class="section-title"><h3>Pengaturan Utama</h3></div>
  <div class="form-grid">
    ${input('setSchool','Nama Sekolah',s.NAMA_SEKOLAH)}
    ${input('setYear','Tahun Pelajaran',s.TAHUN_PELAJARAN,'contoh: 2026-2027')}
    ${select('setSemester','Semester',s.SEMESTER,['Ganjil','Genap'])}
    ${input('setFolder','Folder ID Google Drive',s.FOLDER_ID)}
    ${input('setAdminUser','Username Admin',s.ADMIN_USERNAME||'admin')}
    ${input('setAdminPass','Password Admin',s.ADMIN_PASSWORD||'admin123','',true)}
  </div>
  <div class="form-actions"><button class="btn success" onclick="saveSettings()">Simpan Pengaturan</button><button class="btn secondary" onclick="testFolder()">Tes Folder Drive</button><button class="btn light" onclick="setupOptimizations()">Aktifkan Optimasi</button></div>
  <div id="folderResult" class="muted" style="margin-top:10px"></div></div>`;
}
function input(id,label,value='',hint='',password=false){return `<div class="field"><label>${label}</label><input id="${id}" ${password?'type="password"':''} value="${esc(value)}">${hint?`<div class="muted">${hint}</div>`:''}</div>`}
function select(id,label,value,opts){return `<div class="field"><label>${label}</label><select id="${id}">${opts.map(o=>`<option ${String(o)===String(value)?'selected':''}>${o}</option>`).join('')}</select></div>`}
async function setupOptimizations(){
  try{const r=await call('setupOptimizations');alert(r.message);await loadData()}catch(e){alert(e.message||e)}
}
async function saveSettings(){
  try{
    const r=await call('saveAllSettings',{
      NAMA_SEKOLAH:v('setSchool'),TAHUN_PELAJARAN:v('setYear'),SEMESTER:v('setSemester'),
      FOLDER_ID:v('setFolder'),ADMIN_USERNAME:v('setAdminUser'),ADMIN_PASSWORD:v('setAdminPass')
    });alert(r.message);await loadData();
  }catch(e){alert(e.message||e)}
}
async function testFolder(){
  const r=await call('testDriveFolder',v('setFolder'));
  document.getElementById('folderResult').innerHTML=r.success?`✓ Folder valid: <b>${esc(r.name)}</b>`:`✗ ${esc(r.message)}`;
}
function v(id){return document.getElementById(id).value}

function renderAdmin(c){
  const list=state.data.jenisAdmin;
  c.innerHTML=`<div class="card"><div class="section-title"><h3>Jenis Administrasi</h3><button class="btn" onclick="formAdmin()">+ Tambah</button></div>
  <div class="table-wrap"><table><thead><tr><th>Nama</th><th>Wajib</th><th>Bobot</th><th>Urutan</th><th>Status</th><th>Aksi</th></tr></thead><tbody>
  ${list.map(x=>`<tr><td><b>${esc(x.Nama_Admin)}</b><br><span class="muted">${esc(x.Keterangan)}</span></td><td>${badge(x.Wajib)}</td><td>${esc(x.Bobot)}</td><td>${esc(x.Urutan)}</td><td>${badge(x.Status)}</td><td class="actions"><button class="btn light" onclick='formAdmin(${JSON.stringify(x)})'>Edit</button><button class="btn danger" onclick="disableAdmin('${esc(x.ID_Admin)}')">Nonaktif</button></td></tr>`).join('')}</tbody></table></div></div>`;
}
function formAdmin(x={}){
  modal(`<h3>${x.ID_Admin?'Edit':'Tambah'} Jenis Administrasi</h3>
  <div class="form-grid">
  ${input('aName','Nama Administrasi',x.Nama_Admin||'')}
  ${select('aReq','Wajib',x.Wajib||'Ya',['Ya','Tidak'])}
  ${input('aWeight','Bobot',x.Bobot||0)}
  ${input('aOrder','Urutan',x.Urutan||0)}
  ${select('aStatus','Status',x.Status||'Aktif',['Aktif','Nonaktif'])}
  </div>${input('aDesc','Keterangan',x.Keterangan||'')}
  <div class="form-actions"><button class="btn success" onclick='saveAdmin(${JSON.stringify(x.ID_Admin||'')})'>Simpan</button><button class="btn light" onclick="closeModal()">Batal</button></div>`);
}
async function saveAdmin(id){
  try{await call('saveJenisAdmin',{ID_Admin:id,Nama_Admin:v('aName'),Wajib:v('aReq'),Bobot:v('aWeight'),Urutan:v('aOrder'),Status:v('aStatus'),Keterangan:v('aDesc')});closeModal();await loadData();showPage('admin')}catch(e){alert(e.message||e)}
}
async function disableAdmin(id){if(confirm('Nonaktifkan jenis administrasi ini?')){await call('nonaktifJenisAdmin',id);await loadData();showPage('admin')}}

function renderIndikator(c){
  const list=state.data.indikator;
  c.innerHTML=`<div class="card"><div class="section-title"><h3>Indikator Kinerja</h3><button class="btn" onclick="formIndikator()">+ Tambah</button></div>
  <div class="table-wrap"><table><thead><tr><th>Indikator</th><th>Sumber</th><th>Bobot</th><th>Target</th><th>Status</th><th>Aksi</th></tr></thead><tbody>
  ${list.map(x=>`<tr><td>${esc(x.Nama_Indikator)}</td><td>${esc(x.Sumber_Data)}</td><td>${esc(x.Bobot)}</td><td>${esc(x.Target)}</td><td>${badge(x.Status)}</td><td class="actions"><button class="btn light" onclick='formIndikator(${JSON.stringify(x)})'>Edit</button><button class="btn danger" onclick="disableIndikator('${esc(x.ID_Indikator)}')">Nonaktif</button></td></tr>`).join('')}</tbody></table></div></div>`;
}
function formIndikator(x={}){
  modal(`<h3>${x.ID_Indikator?'Edit':'Tambah'} Indikator Kinerja</h3><div class="form-grid">
  ${input('iName','Nama Indikator',x.Nama_Indikator||'')}
  ${select('iSource','Sumber Data',x.Sumber_Data||'Administrasi',['Administrasi','Absensi','Kegiatan','Manual'])}
  ${input('iWeight','Bobot',x.Bobot||0)}
  ${input('iTarget','Target',x.Target||'')}
  ${select('iStatus','Status',x.Status||'Aktif',['Aktif','Nonaktif'])}</div>
  <div class="form-actions"><button class="btn success" onclick='saveIndikator(${JSON.stringify(x.ID_Indikator||'')})'>Simpan</button><button class="btn light" onclick="closeModal()">Batal</button></div>`);
}
async function saveIndikator(id){
  try{await call('saveIndikator',{ID_Indikator:id,Nama_Indikator:v('iName'),Sumber_Data:v('iSource'),Bobot:v('iWeight'),Target:v('iTarget'),Status:v('iStatus')});closeModal();await loadData();showPage('indikator')}catch(e){alert(e.message||e)}
}
async function disableIndikator(id){if(confirm('Nonaktifkan indikator ini?')){await call('nonaktifIndikator',id);await loadData();showPage('indikator')}}


function renderKegiatan(c){
  const list=state.data.jenisKegiatan||[];
  c.innerHTML=`<div class="card"><div class="section-title"><h3>Konfigurasi Poin Kegiatan</h3><button class="btn" onclick="formKegiatan()">+ Tambah Jenis</button></div><p class="muted">Poin hanya dihitung untuk laporan kegiatan berstatus DISETUJUI.</p><div class="table-wrap"><table><thead><tr><th>Jenis Kegiatan</th><th>Poin</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${list.map(x=>`<tr><td>${esc(x.Jenis_Kegiatan)}</td><td>${esc(x.Poin)}</td><td>${badge(x.Status)}</td><td class="actions"><button class="btn light" onclick='formKegiatan(${JSON.stringify(x)})'>Edit</button><button class="btn danger" onclick="disableKegiatan('${esc(x.ID_Jenis)}')">Nonaktif</button></td></tr>`).join('')||empty(4)}</tbody></table></div></div>`;
}
function formKegiatan(x={}){modal(`<h3>${x.ID_Jenis?'Edit':'Tambah'} Jenis Kegiatan</h3><div class="form-grid">${input('jkName','Jenis Kegiatan',x.Jenis_Kegiatan||'')}${input('jkPoint','Poin',x.Poin||0)}${select('jkStatus','Status',x.Status||'Aktif',['Aktif','Nonaktif'])}</div><div class="form-actions"><button class="btn success" onclick='saveKegiatanCfg(${JSON.stringify(x.ID_Jenis||'')})'>Simpan</button><button class="btn light" onclick="closeModal()">Batal</button></div>`)}
async function saveKegiatanCfg(id){try{await call('saveJenisKegiatan',{ID_Jenis:id,Jenis_Kegiatan:v('jkName'),Poin:v('jkPoint'),Status:v('jkStatus')});closeModal();await loadData();showPage('kegiatan')}catch(e){alert(e.message||e)}}
async function disableKegiatan(id){if(confirm('Nonaktifkan jenis kegiatan ini?')){await call('nonaktifJenisKegiatan',id);await loadData();showPage('kegiatan')}}

function renderPeriode(c){
  const list=state.data.periode;
  c.innerHTML=`<div class="card"><div class="section-title"><h3>Periode</h3><button class="btn" onclick="formPeriode()">+ Tambah</button></div>
  <div class="table-wrap"><table><thead><tr><th>Tahun Pelajaran</th><th>Semester</th><th>Mulai</th><th>Selesai</th><th>Status</th><th>Aksi</th></tr></thead><tbody>
  ${list.map(x=>`<tr><td>${esc(x.Tahun_Pelajaran)}</td><td>${esc(x.Semester)}</td><td>${esc(x.Tanggal_Mulai)}</td><td>${esc(x.Tanggal_Selesai)}</td><td>${badge(x.Status)}</td><td class="actions"><button class="btn light" onclick='formPeriode(${JSON.stringify(x)})'>Edit</button><button class="btn danger" onclick="disablePeriode('${esc(x.ID_Periode)}')">Nonaktif</button></td></tr>`).join('')}</tbody></table></div></div>`;
}
function formPeriode(x={}){
  modal(`<h3>${x.ID_Periode?'Edit':'Tambah'} Periode</h3><div class="form-grid">
  ${input('pYear','Tahun Pelajaran',x.Tahun_Pelajaran||'')}
  ${select('pSem','Semester',x.Semester||'Ganjil',['Ganjil','Genap'])}
  ${input('pStart','Tanggal Mulai',fmtDate(x.Tanggal_Mulai))}
  ${input('pEnd','Tanggal Selesai',fmtDate(x.Tanggal_Selesai))}
  ${select('pStatus','Status',x.Status||'Aktif',['Aktif','Nonaktif'])}</div>
  <div class="form-actions"><button class="btn success" onclick='savePeriode(${JSON.stringify(x.ID_Periode||'')})'>Simpan</button><button class="btn light" onclick="closeModal()">Batal</button></div>`);
}
function fmtDate(x){if(!x)return '';let d=new Date(x);return isNaN(d)?String(x).substring(0,10):d.toISOString().substring(0,10)}
async function savePeriode(id){
  try{await call('savePeriode',{ID_Periode:id,Tahun_Pelajaran:v('pYear'),Semester:v('pSem'),Tanggal_Mulai:v('pStart'),Tanggal_Selesai:v('pEnd'),Status:v('pStatus')});closeModal();await loadData();showPage('periode')}catch(e){alert(e.message||e)}
}
async function disablePeriode(id){if(confirm('Nonaktifkan periode ini?')){await call('nonaktifPeriode',id);await loadData();showPage('periode')}}

function renderGuru(c){
  const list=state.data.guru;
  c.innerHTML=`<div class="card"><div class="section-title"><h3>Data Guru</h3><button class="btn" onclick="formGuru()">+ Tambah Guru</button></div>
  <div class="table-wrap"><table><thead><tr><th>ID</th><th>Guru</th><th>Mapel</th><th>Jabatan</th><th>Username</th><th>Status</th><th>Aksi</th></tr></thead><tbody>
  ${list.map(x=>`<tr><td>${esc(x.ID_Guru)}</td><td><b>${esc(x.Nama_Guru)}</b><br>${esc(x.NIP)}</td><td>${esc(x.Mata_Pelajaran)}</td><td>${esc(x.Jabatan)}</td><td>${esc(x.Username)}</td><td>${badge(x.Status)}</td><td class="actions"><button class="btn light" onclick='formGuru(${JSON.stringify(x)})'>Edit</button><button class="btn danger" onclick="disableGuru('${esc(x.ID_Guru)}')">Nonaktif</button></td></tr>`).join('')}</tbody></table></div></div>`;
}
function formGuru(x={}){
  modal(`<h3>${x.ID_Guru?'Edit':'Tambah'} Data Guru</h3><div class="form-grid">
  ${input('gNip','NIP',x.NIP||'')}${input('gName','Nama Guru',x.Nama_Guru||'')}
  ${input('gDegree','Gelar',x.Gelar||'')}${select('gGender','Jenis Kelamin',x.Jenis_Kelamin||'', ['','Laki-laki','Perempuan'])}
  ${input('gMapel','Mata Pelajaran',x.Mata_Pelajaran||'')}${input('gJabatan','Jabatan',x.Jabatan||'')}
  ${input('gEmail','Email',x.Email||'')}${input('gUser','Username',x.Username||'')}
  ${input('gPass','Password',x.Password||'','',true)}${select('gStatus','Status',x.Status||'Aktif',['Aktif','Nonaktif'])}</div>
  <div class="form-actions"><button class="btn success" onclick='saveGuru(${JSON.stringify(x.ID_Guru||'')})'>Simpan</button><button class="btn light" onclick="closeModal()">Batal</button></div>`);
}
async function saveGuru(id){
  try{await call('saveGuru',{ID_Guru:id,NIP:v('gNip'),Nama_Guru:v('gName'),Gelar:v('gDegree'),Jenis_Kelamin:v('gGender'),Mata_Pelajaran:v('gMapel'),Jabatan:v('gJabatan'),Email:v('gEmail'),Username:v('gUser'),Password:v('gPass'),Status:v('gStatus')});closeModal();await loadData();showPage('guru')}catch(e){alert(e.message||e)}
}
async function disableGuru(id){if(confirm('Nonaktifkan guru ini?')){await call('nonaktifGuru',id);await loadData();showPage('guru')}}

async function renderReports(c){
  c.innerHTML='<div class="card">Memuat laporan...</div>';
  try{
    const list=await call('getAllReports');
    c.innerHTML=`<div class="card"><div class="section-title"><h3>Ringkasan Kinerja Guru</h3><button class="btn light" onclick="window.print()">Cetak</button></div>
    <div class="table-wrap"><table><thead><tr><th>Guru</th><th>Mapel</th><th>Kehadiran</th><th>Kelengkapan Admin</th><th>Admin Disetujui</th><th>Kegiatan Disetujui</th><th>Poin Kegiatan</th><th>Aksi</th></tr></thead><tbody>
    ${list.map(x=>`<tr><td>${esc(x.Nama_Guru)}</td><td>${esc(x.Mata_Pelajaran)}</td><td>${x.Kehadiran}%</td><td>${x.Kelengkapan_Administrasi}%</td><td>${x.Administrasi_Disetujui}%</td><td>${x.Jumlah_Kegiatan}</td><td>${x.Poin_Kegiatan||0}</td><td><button class="btn" onclick="openTeacherReport('${esc(x.ID_Guru)}')">Detail</button></td></tr>`).join('')}</tbody></table></div></div>`;
  }catch(e){c.innerHTML=`<div class="card">${esc(e.message||e)}</div>`}
}
async function openTeacherReport(id){
  try{const r=await call('getGuruReport',id);renderReportObject(r,true)}catch(e){alert(e.message||e)}
}
function renderMyReport(c){call('getGuruReport',state.guruId).then(r=>renderReportObject(r,false)).catch(e=>c.innerHTML=`<div class="card">${esc(e.message||e)}</div>`)}
function renderReportObject(r,modalMode){
  const s=r.summary;
  const html=`<div class="card"><div class="section-title"><h3>Laporan Kinerja Guru</h3><button class="btn light no-print" onclick="window.print()">Cetak / Simpan PDF</button></div>
  <h3>${esc(r.guru.Nama_Guru)}</h3><p>${esc(r.guru.NIP)} · ${esc(r.guru.Mata_Pelajaran)} · ${esc(r.guru.Jabatan)}</p>
  <div class="grid"><div class="stat"><div class="muted">Kehadiran</div><b>${s.kehadiran}%</b></div><div class="stat"><div class="muted">Kelengkapan Administrasi</div><b>${s.administrasiKelengkapan}%</b></div><div class="stat"><div class="muted">Administrasi Disetujui</div><b>${s.administrasiDisetujui}%</b></div><div class="stat"><div class="muted">Kegiatan Disetujui</div><b>${s.jumlahKegiatan}</b></div><div class="stat"><div class="muted">Poin Kegiatan</div><b>${s.poinKegiatan||0}</b></div></div>
  <h3>Rincian Administrasi</h3><div class="table-wrap"><table><thead><tr><th>Administrasi</th><th>Wajib</th><th>Bobot</th><th>Status</th><th>Tanggal</th><th>File</th></tr></thead><tbody>
  ${r.administrasi.map(a=>`<tr><td>${esc(a.jenis)}</td><td>${esc(a.wajib)}</td><td>${esc(a.bobot)}</td><td>${badge(a.status)}</td><td>${esc(a.tanggal)}</td><td>${a.fileUrl?`<a href="${esc(a.fileUrl)}" target="_blank">Buka PDF</a>`:'-'}</td></tr>`).join('')}</tbody></table></div></div>`;
  if(modalMode) modal(html); else document.getElementById('content').innerHTML=html;
}

function modal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
</script>
</body>
</html>
